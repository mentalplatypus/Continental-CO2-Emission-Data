<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<title>CO₂ Emissions by Continent, 1750–2020</title>
<meta name="description" content="A stacked area chart of annual production-based CO₂ emissions for each continent, from the start of the Industrial Revolution to 2020.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* One chart on a soft gradient: title, the matplotlib figure on a white card, then notes and links.
     Dusk theme, shared with the home page (mentalplatypus.github.io). */
  :root {
    --bg-1: #eef0ff; --bg-2: #f6eefc; --bg-3: #fff1ea;
    --line: rgba(40, 34, 110, 0.12); --ink: #1e1b3a; --ink-soft: #5d5a7a; --accent: #5b5bd6;
    --shadow: 0 1px 2px rgba(40, 34, 110, 0.06), 0 12px 32px rgba(40, 34, 110, 0.08);
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-1: #0f1226; --bg-2: #1d1438; --bg-3: #2a1a2e;
      --line: rgba(255, 255, 255, 0.12); --ink: #ecebff; --ink-soft: #a6a3c8; --accent: #8f8cff;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg-1: #0f1226; --bg-2: #1d1438; --bg-3: #2a1a2e;
    --line: rgba(255, 255, 255, 0.12); --ink: #ecebff; --ink-soft: #a6a3c8; --accent: #8f8cff;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35); color-scheme: dark;
  }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font-family: var(--font-body);
    background-color: var(--bg-1);
    background-image: linear-gradient(160deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
    background-attachment: fixed;
    padding-block: 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  .home { align-self: flex-start; font-size: 0.85rem; font-weight: 600; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--line); }
  .home:hover { border-bottom-color: var(--accent); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(1.7rem, 5vw, 2.6rem); letter-spacing: -0.03em; line-height: 1.05; margin: 0; text-wrap: balance; }
  .lede { margin: 0; color: var(--ink-soft); font-size: 0.95rem; line-height: 1.6; max-width: 70ch; }
  figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 14px; }
  figure img { display: block; width: 100%; height: auto; }
  .notes { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 24px; font-size: 0.85rem; color: var(--ink-soft); }
  .notes a { color: var(--ink); font-weight: 600; text-decoration-color: var(--line); text-underline-offset: 3px; }
  .notes a:hover { text-decoration-color: var(--accent); }
  a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

  /* light/dark switch, top right on every page of the site; the choice is shared through localStorage "theme" */
  .theme-toggle {
    position: absolute; top: 12px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 10;
    width: 36px; height: 36px; padding: 0; display: grid; place-items: center; border-radius: 50%; cursor: pointer;
    color: var(--ink); background: var(--surface, var(--board, transparent)); border: 1px solid var(--line, var(--grid-major));
    transition: border-color 0.15s, color 0.15s;
  }
  .theme-toggle:hover { color: var(--accent, var(--apple)); border-color: var(--accent, var(--apple)); }
  .theme-toggle:focus-visible { outline: 3px solid var(--accent, var(--apple)); outline-offset: 3px; }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }
</style>

<button class="theme-toggle" type="button"></button>
<script>
  // Light/dark switch. Follows the device until clicked, then remembers the choice for every page on this site.
  (function () {
    var root = document.documentElement, btn = document.querySelector(".theme-toggle"), mq = matchMedia("(prefers-color-scheme: dark)");
    var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
    var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
    function current() { return root.dataset.theme || (mq.matches ? "dark" : "light"); }
    function paint() {
      var dark = current() === "dark", label = dark ? "Switch to light mode" : "Switch to dark mode";
      btn.innerHTML = dark ? SUN : MOON; btn.setAttribute("aria-label", label); btn.title = label;
    }
    function apply(t) { root.dataset.theme = t; paint(); window.dispatchEvent(new Event("themechange")); }
    btn.addEventListener("click", function () {
      var t = current() === "dark" ? "light" : "dark";
      try { localStorage.setItem("theme", t); } catch (e) {}
      apply(t);
    });
    window.addEventListener("storage", function (e) { if (e.key === "theme" && (e.newValue === "light" || e.newValue === "dark")) apply(e.newValue); });
    mq.addEventListener("change", paint);
    paint();
  })();
</script>

<div class="wrap">
  <a class="home" href="https://mentalplatypus.github.io/">← David Wang</a>
  <h1>CO₂ Emissions by Continent, 1750–2020</h1>
  <p class="lede">A stacked area chart of annual production-based CO₂ emissions for each continent, from the start of the Industrial Revolution to 2020.</p>
  <figure>
    <img src="chart.png" alt="Stacked area chart of annual CO2 emissions by continent from 1750 to 2020. Emissions are near zero until the mid-1800s, then grow to about 35,000 million metric tons a year by the late 2010s. Europe and North America dominate until the late 1900s, when Asia becomes the largest emitter.">
  </figure>
  <div class="notes">
    <span>Data: <a href="https://github.com/owid/co2-data">Our World in Data CO₂ dataset</a></span>
    <span>Made with Python, pandas and matplotlib · <a href="https://github.com/mentalplatypus/Continental-CO2-Emission-Data">View the code</a></span>
  </div>
</div>
